services:
  app:
    image: ghcr.io/biorubenfs/bibliopolis-backend:${BACKEND_TAG:?BACKEND_TAG no definido en .env}
    restart: unless-stopped
    env_file:
      - .env
    # Overrides a PORT in the .env: the overrides publish host:3000, so the app must listen there
    environment:
      PORT: 3000
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 384M
        reservations:
          cpus: "0.25"
          memory: 192M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

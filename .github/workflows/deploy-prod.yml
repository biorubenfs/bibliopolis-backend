name: Deploy production

# Se lanza a mano eligiendo un tag `vX.Y.Z` en «Use workflow from». No construye nada: despliega en producción
# la imagen de esa versión, que ya existe en GHCR. Sirve para hacer rollback o para redesplegar la versión actual.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bibliopolis.es

    steps:
      - name: Only from a version tag
        if: github.ref_type != 'tag' || !startsWith(github.ref_name, 'v')
        run: |
          echo "::error::Elige un tag vX.Y.Z en «Use workflow from» (ref actual: ${{ github.ref_name }})"
          exit 1

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the image exists
        run: docker manifest inspect ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }} > /dev/null

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to production
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "BACKEND_TAG='${{ steps.version.outputs.version }}' DEPLOY_PATH='${{ secrets.VPS_PATH }}' COMPOSE_ENV=prod bash -s" << 'EOF'
            set -e
            cd "$DEPLOY_PATH"
            if grep -q '^BACKEND_TAG=' .env; then
              sed -i "s/^BACKEND_TAG=.*/BACKEND_TAG=$BACKEND_TAG/" .env
            else
              echo "BACKEND_TAG=$BACKEND_TAG" >> .env
            fi
            docker compose -f docker-compose.yml -f "docker-compose.$COMPOSE_ENV.yml" up -d --pull always
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa

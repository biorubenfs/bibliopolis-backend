name: Deploy dev

# Se lanza a mano desde cualquier rama: publica la imagen `dev` en GHCR y la despliega en el entorno dev del VPS.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev.bibliopolis.es

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to dev
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "BACKEND_TAG=dev DEPLOY_PATH='${{ secrets.VPS_PATH }}' COMPOSE_ENV=dev bash -s" << 'EOF'
            set -e
            cd "$DEPLOY_PATH"
            if grep -q '^BACKEND_TAG=' .env; then
              sed -i "s/^BACKEND_TAG=.*/BACKEND_TAG=$BACKEND_TAG/" .env
            else
              echo "BACKEND_TAG=$BACKEND_TAG" >> .env
            fi
            docker compose -f docker-compose.yml -f "docker-compose.$COMPOSE_ENV.yml" up -d --pull always
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa
